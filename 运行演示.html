<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台记忆面板</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #fff;
      --line: #d9dee7;
      --ink: #151922;
      --muted: #667085;
      --green: #17694f;
      --green-soft: #e8f5ef;
      --blue-soft: #edf4ff;
      --yellow-soft: #fff7df;
      --red: #d92d20;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      cursor: pointer;
      min-height: 34px;
      padding: 7px 12px;
    }
    button:hover { border-color: var(--green); background: var(--green-soft); }
    button.primary { background: var(--green); color: #fff; border-color: var(--green); font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 78px; resize: vertical; }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .titlebar {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(620px, 1.4fr);
      gap: 12px;
      padding: 10px 14px 8px;
      align-items: center;
    }
    .brand {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .badge-red {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }
    h1 { margin: 0; font-size: 18px; line-height: 1.2; }
    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 120px 160px minmax(220px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
    }
    .checks {
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
      color: var(--muted);
      font-size: 13px;
    }
    .checks input { width: auto; }
    .wide-action {
      padding: 0 14px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .52fr);
      gap: 12px;
    }
    .greenbar {
      background: var(--green);
      color: #fff;
      border-radius: 6px;
      border: 0;
      min-height: 36px;
      font-weight: 800;
      width: 100%;
    }
    .notice {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      padding: 9px 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rows {
      padding: 12px 14px 0;
      display: grid;
      gap: 10px;
    }
    .control-row {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(560px, 1.5fr) minmax(260px, .72fr);
      gap: 10px;
      align-items: center;
    }
    .row-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 10px 12px;
      min-height: 58px;
    }
    .row-title { font-weight: 800; margin-bottom: 2px; }
    .row-sub { color: var(--muted); font-size: 12px; }
    .inline-controls {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
    }
    .small-controls {
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--blue-soft);
      padding: 5px 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .main {
      padding: 12px 14px 18px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .summary .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 11px 12px;
      min-height: 76px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .card-value { font-size: 18px; font-weight: 850; margin-top: 6px; }
    .tag {
      display: inline-block;
      border-radius: 999px;
      background: var(--yellow-soft);
      color: #8a5a00;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap;
    }
    .tag.ok { background: #dcfce7; color: #166534; }
    .tag.blue { background: var(--blue-soft); color: #1d4ed8; }
    .columns {
      display: grid;
      grid-template-columns: repeat(6, minmax(300px, 1fr));
      gap: 10px;
      align-items: start;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .col {
      min-width: 300px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-height: calc(100vh - 320px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .col-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: start;
    }
    .col-title { font-weight: 850; }
    .col-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .col-body {
      padding: 10px;
      overflow: auto;
      min-height: 360px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      margin-bottom: 8px;
      background: #fff;
    }
    .item.soft { background: #fbfcfe; }
    .item-title {
      font-weight: 750;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .item-meta { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
    .item-body { margin-top: 8px; white-space: pre-wrap; font-size: 13px; }
    .split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .query-row { display: grid; grid-template-columns: 1fr 72px; gap: 7px; margin-bottom: 8px; }
    .doc-panel {
      margin-top: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 260px;
      overflow: hidden;
    }
    .doc-meta {
      border-right: 1px solid var(--line);
      padding: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .doc-body {
      padding: 12px;
      max-height: 360px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      background: #fbfcfe;
    }
    .empty { color: var(--muted); text-align: center; padding: 28px 10px; }
    @media (max-width: 1200px) {
      .titlebar, .wide-action, .control-row, .doc-panel { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      .col { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="titlebar">
      <div class="brand">
        <div class="badge-red">17</div>
        <div>
          <h1>工作台记忆面板</h1>
          <div class="meta" id="top-meta">读取中</div>
        </div>
      </div>
      <div class="toolbar">
        <select id="project-select"><option>AI工作台</option></select>
        <select id="module-select"><option>全部模块</option></select>
        <select id="branch-select"><option>main</option></select>
        <div class="checks">
          <label><input id="toggle-b" type="checkbox" checked> 索引</label>
          <label><input id="toggle-c" type="checkbox" checked> Git</label>
          <label><input id="toggle-a" type="checkbox"> 受限</label>
        </div>
        <button id="refresh-all" class="primary">读取数据</button>
      </div>
    </div>
    <div class="wide-action">
      <button id="run-handoff" class="greenbar">生成新窗口接手包</button>
      <div class="notice" id="top-notice">等待读取</div>
    </div>
  </div>

  <div class="rows">
    <div class="control-row">
      <div class="row-card">
        <div class="row-title">按口语查索引</div>
        <div class="row-sub">页面、技能、窗口、字段</div>
      </div>
      <div class="row-card inline-controls">
        <input id="query" value="页面22">
        <button data-query="页面22">页面22</button>
        <button data-query="技能1">技能1</button>
        <button id="resolve-query" class="primary">查询</button>
      </div>
      <div class="row-card small-controls">
        <button data-query="小测">小测</button>
        <button data-query="连接服务器">连接服务器</button>
      </div>
    </div>
    <div class="control-row">
      <div class="row-card">
        <div class="row-title">本机 MD 导入</div>
        <div class="row-sub">导入项目资料或受限资料</div>
      </div>
      <div class="row-card inline-controls">
        <select id="candidate-select"></select>
        <label class="chip"><input id="restricted-import" type="checkbox"> 受限</label>
        <button id="import-selected" class="primary">导入</button>
      </div>
      <div class="row-card small-controls">
        <button id="refresh-candidates">刷新候选</button>
        <button id="open-import-index">导入目录</button>
      </div>
    </div>
    <div class="control-row">
      <div class="row-card">
        <div class="row-title">Git 分支</div>
        <div class="row-sub">查看分支、提交、工作区</div>
      </div>
      <div class="row-card small-controls">
        <button id="refresh-git" class="primary">刷新 Git</button>
        <button id="run-check">系统自检</button>
        <button id="open-readme">README</button>
      </div>
      <div class="row-card" id="git-line">读取中</div>
    </div>
  </div>

  <main class="main">
    <section class="summary" id="summary"></section>

    <section class="columns">
      <div class="col">
        <div class="col-head">
          <div><div class="col-title">新窗口接手</div><div class="col-sub">StartPack / 当前事实</div></div>
          <span class="tag ok" id="handoff-count">0</span>
        </div>
        <div class="col-body" id="handoff-col"></div>
      </div>
      <div class="col">
        <div class="col-head">
          <div><div class="col-title">实战索引</div><div class="col-sub">别名 / 页面 / 技能</div></div>
          <span class="tag blue" id="index-count">0</span>
        </div>
        <div class="col-body" id="index-col"></div>
      </div>
      <div class="col">
        <div class="col-head">
          <div><div class="col-title">导入资料</div><div class="col-sub">本机 MD / TXT</div></div>
          <span class="tag ok" id="import-count">0</span>
        </div>
        <div class="col-body" id="import-col"></div>
      </div>
      <div class="col">
        <div class="col-head">
          <div><div class="col-title">Git 分支</div><div class="col-sub">branch / commit / status</div></div>
          <span class="tag" id="branch-count">0</span>
        </div>
        <div class="col-body" id="git-col"></div>
      </div>
      <div class="col">
        <div class="col-head">
          <div><div class="col-title">资源登记</div><div class="col-sub">页面编号 / 端口 / 电脑</div></div>
          <span class="tag ok" id="resource-count">0</span>
        </div>
        <div class="col-body" id="resource-col"></div>
      </div>
      <div class="col">
        <div class="col-head">
          <div><div class="col-title">待审核</div><div class="col-sub">proposed / skill / resource</div></div>
          <span class="tag" id="proposal-count">0</span>
        </div>
        <div class="col-body" id="proposal-col"></div>
      </div>
    </section>

    <section class="doc-panel">
      <div class="doc-meta" id="doc-meta">未选择文档</div>
      <div class="doc-body" id="doc-body"></div>
    </section>
  </main>

  <script>
    const state = { status: null, structure: null, git: null, resources: null, imported: null, proposals: null, candidates: null, startPack: null, index: null };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch]));
    async function api(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    function item(title, meta, body = "", path = "") {
      const action = path ? `<button data-doc="${escapeHtml(path)}">打开</button>` : "";
      return `<div class="item"><div class="item-title"><span>${escapeHtml(title)}</span>${action}</div><div class="item-meta">${escapeHtml(meta)}</div>${body ? `<div class="item-body">${escapeHtml(body)}</div>` : ""}</div>`;
    }
    function renderSummary() {
      const check = state.status?.check?.code === 0 ? "CHECK_PASS" : "CHECK_FAIL";
      const gitDirty = state.git?.status?.length || 0;
      const imported = state.imported?.imported?.length || 0;
      const proposals = state.proposals?.proposals?.length || 0;
      const branches = state.git?.branches?.length || 0;
      const pages = state.resources?.pageBadges?.filter((row) => row["编号"]).length || 0;
      $("#summary").innerHTML = [
        ["系统状态", check, "自检"],
        ["Git分支", `${branches} 个`, gitDirty ? `${gitDirty} 个改动` : "干净"],
        ["导入资料", `${imported} 份`, "08_导入资料"],
        ["待审核", `${proposals} 条`, "05_待审核"],
        ["页面编号", `${pages} 个`, "资源登记"],
        ["当前分支", state.git?.current || "-", "Git"],
      ].map(([name, value, sub]) => `<div class="card"><div class="card-head"><span>${name}</span><span class="tag">${sub}</span></div><div class="card-value">${value}</div></div>`).join("");
      $("#top-meta").textContent = `${state.status?.repo || ""} · ${state.git?.current || "-"} · ${state.status?.gitLatest || ""}`;
      $("#top-notice").textContent = `候选 ${state.candidates?.candidates?.length || 0} · 导入 ${imported} · 待审核 ${proposals} · 工作区 ${gitDirty ? "有改动" : "干净"}`;
      $("#git-line").textContent = state.git?.remote || "未配置远端";
    }
    function renderHandoff() {
      const data = state.startPack;
      if (!data) {
        $("#handoff-count").textContent = "0";
        $("#handoff-col").innerHTML = "<div class='empty'>点击上方“生成新窗口接手包”后显示。</div>";
        return;
      }
      $("#handoff-count").textContent = data.filesRead.length;
      $("#handoff-col").innerHTML = [
        item("读取文件", "接手顺序", data.filesRead.join("\n")),
        item("当前目标", "StartPack", data.goal),
        item("当前状态", "StartPack", data.state),
        item("确认规则", "StartPack", data.confirmedRules),
      ].join("");
    }
    function renderIndex() {
      const data = state.index;
      $("#index-count").textContent = data ? 1 : 0;
      if (!data) {
        $("#index-col").innerHTML = "<div class='empty'>输入口语后查询</div>";
        return;
      }
      $("#index-col").innerHTML = [
        item("用户说法", data.query, `标准编号：${data.standard}`),
        data.alias ? item("别名命中", data.alias["标准对象"], data.alias["下一步"]) : item("别名命中", "无"),
        data.page ? item("页面命中", data.page["页面名"], `${data.page["页面编号"]}\n${data.page["入口/路径"]}\n${data.page["文档定位"]}`) : "",
        data.skill ? item("技能命中", data.skill["技能名"], `${data.skill["技能ID"]}\n${data.skill["建议文档"]}`) : "",
      ].join("");
    }
    function renderImported() {
      const imported = state.imported?.imported || [];
      $("#import-count").textContent = imported.length;
      $("#import-col").innerHTML = imported.length ? imported.map((row) => item(row.title, `${row.sensitivity} · ${row.status}`, row.path, row.path)).join("") : "<div class='empty'>暂无导入资料</div>";
    }
    function renderGit() {
      const git = state.git;
      if (!git) return;
      $("#branch-count").textContent = git.branches.length;
      const status = git.status.length ? git.status.map((line) => item(line, "working tree")).join("") : item("工作区干净", "status", "", "");
      const branches = git.branches.map((row) => item(row.active ? `* ${row.name}` : row.name, row.commit.slice(0, 12), row.message)).join("");
      const commits = git.commits.map((row) => item(row.commit, "commit", row.message)).join("");
      $("#git-col").innerHTML = `<div class="item soft"><div class="item-title"><span>当前分支</span><span class="tag ok">${escapeHtml(git.current)}</span></div><div class="item-meta">${escapeHtml(git.remote || "无远端")}</div></div>${status}${branches}${commits}`;
      $("#branch-select").innerHTML = git.branches.map((row) => `<option ${row.active ? "selected" : ""}>${escapeHtml(row.name)}</option>`).join("");
    }
    function renderResources() {
      const res = state.resources;
      if (!res) return;
      const pages = res.pageBadges.filter((row) => row["编号"]).slice(-12).reverse();
      $("#resource-count").textContent = res.pageBadges.filter((row) => row["编号"]).length;
      $("#resource-col").innerHTML = [
        item("页面编号池", "AI工作台", `${pages.length} 条显示`),
        ...pages.map((row) => item(`#${row["编号"]} ${row["页面/模块"]}`, row["项目"], row["路径或说明"])),
        item("端口", `${res.ports.length} 条`, res.ports.slice(0, 4).map((row) => Object.values(row).join(" · ")).join("\n")),
        item("电脑环境", `${res.machines.length} 台`, res.machines.map((row) => Object.values(row).join(" · ")).join("\n")),
      ].join("");
    }
    function renderProposals() {
      const rows = state.proposals?.proposals || [];
      $("#proposal-count").textContent = rows.length;
      $("#proposal-col").innerHTML = `
        <div class="item soft">
          <input id="proposal-title" value="页面22接手规则补充">
          <textarea id="proposal-detail">用户说页面22时，AI 应先查别名词典和页面索引，再读项目 StartPack。</textarea>
          <div class="split2"><button id="create-demo-proposal">生成演示提案</button><button id="create-real-proposal" class="primary">写入待审核</button></div>
        </div>
        ${rows.map((row) => item(row.title, `${row.category} · ${row.status}`, `${row.id}\n${row.path}`, row.path.startsWith("05_") ? row.path : "")).join("")}
      `;
    }
    function renderCandidates() {
      const candidates = state.candidates?.candidates || [];
      $("#candidate-select").innerHTML = candidates.slice(0, 80).map((row) => `<option value="${escapeHtml(row.path)}" data-restricted="${row.restrictedHint ? "1" : "0"}">${escapeHtml(row.name)} · ${Math.round(row.size / 1024)}KB</option>`).join("");
    }
    async function openDoc(path) {
      const data = await api(`/api/document?path=${encodeURIComponent(path)}`);
      const meta = data.frontmatter || {};
      $("#doc-meta").innerHTML = `<b>${escapeHtml(data.path)}</b><br>${escapeHtml(meta.type || "-")} · ${escapeHtml(meta.status || "-")} · ${escapeHtml(meta.sensitivity || "-")}${data.restricted ? " · 受限脱敏" : ""}`;
      $("#doc-body").textContent = data.body;
    }
    async function loadAll() {
      const [status, structure, git, resources, imported, proposals, candidates] = await Promise.all([
        api("/api/status"),
        api("/api/structure"),
        api("/api/git"),
        api("/api/resources"),
        api("/api/imported"),
        api("/api/proposals"),
        api("/api/import-candidates"),
      ]);
      Object.assign(state, { status, structure, git, resources, imported, proposals, candidates, startPack: null });
      renderSummary(); renderHandoff(); renderIndex(); renderImported(); renderGit(); renderResources(); renderProposals(); renderCandidates();
      if (!$("#doc-body").textContent) openDoc("README.md");
    }
    async function generateHandoff() {
      state.startPack = await api("/api/start-pack");
      renderHandoff();
      $("#top-notice").textContent = `接手包已生成 · 读取 ${state.startPack.filesRead.length} 个核心文件 · 显示在“新窗口接手”列`;
      document.querySelector("#handoff-col").scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
    }
    async function resolveQuery(value) {
      state.index = await api(`/api/resolve?q=${encodeURIComponent(value)}`);
      renderIndex();
      $("#doc-meta").innerHTML = "<b>索引结果</b>";
      $("#doc-body").textContent = JSON.stringify(state.index, null, 2);
    }
    async function importSelected() {
      const select = $("#candidate-select");
      const path = select.value;
      const title = select.selectedOptions[0]?.textContent?.split(" · ")[0] || "导入资料";
      const restricted = $("#restricted-import").checked || select.selectedOptions[0]?.dataset.restricted === "1";
      const result = await api("/api/import-material", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, title, restricted }),
      });
      state.imported = await api("/api/imported");
      renderImported(); renderSummary();
      openDoc(result.path);
    }
    async function createProposal(official) {
      const result = await api("/api/proposal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: $("#proposal-title").value,
          detail: $("#proposal-detail").value,
          official,
          kind: "memory",
        }),
      });
      state.proposals = await api("/api/proposals");
      renderProposals(); renderSummary();
      $("#doc-meta").innerHTML = `<b>${escapeHtml(result.path)}</b>`;
      $("#doc-body").textContent = result.content;
    }
    async function runCheck() {
      const data = await api("/api/check");
      $("#doc-meta").innerHTML = "<b>系统自检</b>";
      $("#doc-body").textContent = data.check.output;
      state.status = await api("/api/status");
      renderSummary();
    }
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.doc) openDoc(button.dataset.doc);
      if (button.dataset.query) { $("#query").value = button.dataset.query; resolveQuery(button.dataset.query); }
      if (button.id === "refresh-all") loadAll();
      if (button.id === "run-handoff") generateHandoff();
      if (button.id === "resolve-query") resolveQuery($("#query").value || "页面22");
      if (button.id === "refresh-candidates") { state.candidates = await api("/api/import-candidates"); renderCandidates(); }
      if (button.id === "import-selected") importSelected();
      if (button.id === "open-import-index") openDoc("08_导入资料/README.md");
      if (button.id === "refresh-git") { state.git = await api("/api/git"); renderGit(); renderSummary(); }
      if (button.id === "run-check") runCheck();
      if (button.id === "open-readme") openDoc("README.md");
      if (button.id === "create-demo-proposal") createProposal(false);
      if (button.id === "create-real-proposal") createProposal(true);
    });
    $("#candidate-select").addEventListener("change", () => {
      $("#restricted-import").checked = $("#candidate-select").selectedOptions[0]?.dataset.restricted === "1";
    });
    loadAll().catch((error) => {
      $("#top-meta").textContent = "读取失败";
      $("#doc-body").textContent = String(error);
    });
  </script>
</body>
</html>
