<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 工作台记忆面板</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --subtle: #eef2f6;
      --line: #d6dde6;
      --ink: #172033;
      --muted: #637083;
      --accent: #0f766e;
      --accent-soft: #d9f4ef;
      --warn: #a16207;
      --danger: #b42318;
      --ok: #166534;
      --code: #111827;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
    }
    .header-inner {
      max-width: 1500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 16px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .status {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .pill {
      border: 1px solid var(--line);
      background: var(--subtle);
      padding: 6px 9px;
      font-size: 13px;
      white-space: nowrap;
    }
    .pill.ok {
      color: var(--ok);
      background: #ecfdf3;
      border-color: #bbf7d0;
    }
    .pill.warn {
      color: var(--warn);
      background: #fffbeb;
      border-color: #fde68a;
    }
    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 16px 18px 36px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 410px;
      gap: 14px;
    }
    nav,
    .right-pane,
    .main-pane {
      border: 1px solid var(--line);
      background: var(--surface);
      min-width: 0;
    }
    nav {
      align-self: start;
      position: sticky;
      top: 84px;
      max-height: calc(100vh - 104px);
      overflow: auto;
      padding: 12px;
    }
    .main-pane {
      padding: 14px;
      display: grid;
      gap: 14px;
    }
    .right-pane {
      align-self: start;
      position: sticky;
      top: 84px;
      max-height: calc(100vh - 104px);
      overflow: auto;
      padding: 12px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 17px;
      letter-spacing: 0;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 14px;
      letter-spacing: 0;
    }
    .nav-title {
      color: var(--muted);
      font-size: 12px;
      margin: 12px 0 7px;
      text-transform: uppercase;
    }
    button,
    input,
    textarea,
    select {
      font: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
      background: #f0fdfa;
    }
    .nav-button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 10px;
      margin-bottom: 7px;
      min-height: 38px;
    }
    .nav-button.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .file-button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 7px 8px;
      margin-bottom: 5px;
      font-size: 13px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .section {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .panel {
      border: 1px solid var(--line);
      padding: 12px;
      background: var(--surface);
      min-height: 110px;
    }
    .module-row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) 120px;
      gap: 10px;
      align-items: start;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
    }
    .module-row:first-child {
      padding-top: 0;
    }
    .module-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    .muted {
      color: var(--muted);
    }
    .flow {
      display: grid;
      grid-template-columns: repeat(7, minmax(96px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .flow div {
      border: 1px solid var(--line);
      background: var(--subtle);
      padding: 9px;
      min-height: 66px;
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .toolbar button {
      min-height: 38px;
      padding: 8px 11px;
    }
    .form-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 128px;
      gap: 8px;
      margin-bottom: 10px;
    }
    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 9px 10px;
    }
    textarea {
      min-height: 116px;
      resize: vertical;
    }
    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 640px;
      font-size: 13px;
    }
    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 8px 9px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--subtle);
      color: var(--muted);
      font-weight: 600;
    }
    pre {
      margin: 0;
      background: var(--code);
      color: #e5e7eb;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 300px;
      font-size: 13px;
      overflow: auto;
    }
    .doc-body {
      border: 1px solid var(--line);
      background: #fbfcfe;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      max-height: 58vh;
      overflow: auto;
    }
    .hidden {
      display: none;
    }
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 12px;
    }
    .checkline {
      border-left: 4px solid var(--accent);
      background: var(--subtle);
      padding: 9px 10px;
      margin-bottom: 8px;
    }
    .danger {
      color: var(--danger);
    }
    @media (max-width: 1180px) {
      main {
        grid-template-columns: 260px minmax(0, 1fr);
      }
      .right-pane {
        grid-column: 1 / -1;
        position: static;
        max-height: none;
      }
      .flow {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 780px) {
      .header-inner,
      main,
      .grid-2,
      .grid-3,
      .split,
      .form-row {
        grid-template-columns: 1fr;
      }
      nav {
        position: static;
        max-height: none;
      }
      .status {
        justify-content: flex-start;
      }
      .flow {
        grid-template-columns: 1fr;
      }
      .module-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>AI 工作台记忆面板</h1>
        <p class="subtitle">管理共享 MD 系统：结构、索引、接手包、资源、提案和自检。</p>
      </div>
      <div class="status" id="status">连接中</div>
    </div>
  </header>

  <main>
    <nav>
      <h2>工作区</h2>
      <button class="nav-button active" data-view="structure">系统结构</button>
      <button class="nav-button" data-view="handoff">新窗口接手</button>
      <button class="nav-button" data-view="index">实战索引</button>
      <button class="nav-button" data-view="resources">资源登记</button>
      <button class="nav-button" data-view="proposals">待审核提案</button>
      <button class="nav-button" data-view="secrets">凭据规则</button>
      <button class="nav-button" data-view="check">系统自检</button>
      <div class="nav-title">核心文件</div>
      <div id="file-list"></div>
    </nav>

    <div class="main-pane">
      <section id="view-structure">
        <h2>系统结构</h2>
        <div class="flow" id="workflow"></div>
        <div id="modules"></div>
      </section>

      <section id="view-handoff" class="hidden">
        <h2>新窗口接手</h2>
        <div class="toolbar">
          <button id="load-startpack">生成接手包</button>
          <button data-open-doc="AI入口.md">打开 AI入口</button>
          <button data-open-doc="01_项目/AI工作台/StartPack.md">打开 StartPack</button>
          <button data-open-doc="01_项目/AI工作台/当前状态.md">打开当前状态</button>
        </div>
        <div id="handoff-summary" class="grid-2"></div>
      </section>

      <section id="view-index" class="hidden">
        <h2>实战索引</h2>
        <div class="form-row">
          <input id="query" value="页面22" aria-label="查询">
          <button id="resolve">查询</button>
        </div>
        <div class="toolbar">
          <button data-query="页面22">页面22</button>
          <button data-query="技能1">技能1</button>
          <button data-query="小测">小测</button>
          <button data-query="连接服务器">连接服务器</button>
        </div>
        <div id="index-result"></div>
      </section>

      <section id="view-resources" class="hidden">
        <h2>资源登记</h2>
        <div class="toolbar">
          <button data-resource="pageBadges">页面编号</button>
          <button data-resource="ports">端口</button>
          <button data-resource="machines">电脑环境</button>
          <button data-resource="secretRefs">Secret引用</button>
          <button data-resource="serverCandidates">服务器候选</button>
        </div>
        <div id="resource-view"></div>
      </section>

      <section id="view-proposals" class="hidden">
        <h2>待审核提案</h2>
        <div class="split">
          <div>
            <div class="grid-2">
              <input id="proposal-title" value="页面22接手规则补充" aria-label="提案标题">
              <select id="proposal-kind" aria-label="提案类型">
                <option value="memory">记忆提案</option>
                <option value="skill">Skill提案</option>
                <option value="resource">资源变更</option>
              </select>
            </div>
            <textarea id="proposal-detail">用户说页面22时，AI 应先查别名词典和页面索引，再读项目 StartPack。</textarea>
            <label class="muted"><input id="proposal-official" type="checkbox"> 保存到正式 `05_待审核` 目录</label>
            <div class="toolbar">
              <button id="create-proposal">生成提案</button>
              <button id="load-proposals">刷新列表</button>
            </div>
          </div>
          <div>
            <div class="checkline">默认生成到 `.demo_runtime/`，不污染正式仓库。勾选后才进入正式待审核目录。</div>
          </div>
        </div>
        <div id="proposal-list"></div>
      </section>

      <section id="view-secrets" class="hidden">
        <h2>凭据规则</h2>
        <div id="secret-policy"></div>
      </section>

      <section id="view-check" class="hidden">
        <h2>系统自检</h2>
        <div class="toolbar">
          <button id="run-check">运行自检</button>
          <button data-open-doc="scripts/check_memory_repo.py">打开检查脚本</button>
        </div>
        <pre id="check-output">等待运行。</pre>
      </section>
    </div>

    <aside class="right-pane">
      <h2>文件 / 输出</h2>
      <div id="doc-meta" class="muted">选择左侧文件或运行一个操作。</div>
      <div id="doc-body" class="doc-body">暂无内容。</div>
    </aside>
  </main>

  <script>
    const state = { structure: null, resources: null };
    const statusEl = document.querySelector("#status");
    const fileList = document.querySelector("#file-list");
    const docMeta = document.querySelector("#doc-meta");
    const docBody = document.querySelector("#doc-body");

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;",
    }[ch]));

    async function api(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    function renderStatus(data) {
      statusEl.innerHTML = [
        `<span class="pill ${data.check.code === 0 ? "ok" : "warn"}">${data.check.code === 0 ? "CHECK_PASS" : "CHECK_FAIL"}</span>`,
        `<span class="pill">${data.markdownFiles} 个 MD</span>`,
        `<span class="pill ${data.workingTreeClean ? "ok" : "warn"}">${data.workingTreeClean ? "Git 干净" : "Git 有改动"}</span>`,
      ].join("");
    }

    function table(rows) {
      if (!rows || rows.length === 0) return "<div class='muted'>暂无数据。</div>";
      const keys = Object.keys(rows[0]);
      return `<div class="table-wrap"><table><thead><tr>${keys.map((key) => `<th>${escapeHtml(key)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${keys.map((key) => `<td>${escapeHtml(row[key])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }

    function renderStructure(data) {
      document.querySelector("#workflow").innerHTML = data.workflow.map((item, index) => `<div><b>${index + 1}</b><br>${escapeHtml(item)}</div>`).join("");
      document.querySelector("#modules").innerHTML = data.modules.map((item) => `
        <div class="module-row">
          <div><b>${escapeHtml(item.module)}</b><br><span class="muted">${escapeHtml(item.role)}</span></div>
          <div>${escapeHtml(item.purpose)}<br><span class="muted">读取：${escapeHtml(item.defaultRead)}</span></div>
          <div>${item.files.map((file) => `<button class="file-button" data-open-doc="${escapeHtml(file)}">${escapeHtml(file.split("/").pop())}</button>`).join("")}</div>
        </div>
      `).join("");
      const priority = [
        "AI入口.md",
        "总览.md",
        "07_实战索引/README.md",
        "07_实战索引/别名词典.md",
        "07_实战索引/页面索引.md",
        "01_项目/AI工作台/StartPack.md",
        "01_项目/AI工作台/当前状态.md",
        "05_待审核/README.md",
        "04_资源登记/页面角标编号.md",
        "00_规则/敏感信息规则.md",
      ];
      fileList.innerHTML = priority.map((file) => `<button class="file-button" data-open-doc="${escapeHtml(file)}">${escapeHtml(file)}</button>`).join("");
    }

    async function openDoc(path) {
      const data = await api(`/api/document?path=${encodeURIComponent(path)}`);
      const meta = data.frontmatter || {};
      docMeta.innerHTML = `<b>${escapeHtml(data.path)}</b><br>状态：${escapeHtml(meta.status || "-")}　类型：${escapeHtml(meta.type || "-")}　敏感：${escapeHtml(meta.sensitivity || "-")}${data.restricted ? "　<span class='danger'>已脱敏</span>" : ""}`;
      docBody.textContent = data.body;
    }

    async function loadStartPack() {
      const data = await api("/api/start-pack");
      document.querySelector("#handoff-summary").innerHTML = [
        ["读取文件", data.filesRead.join("\n")],
        ["当前目标", data.goal],
        ["当前状态", data.state],
        ["已确认规则", data.confirmedRules],
      ].map(([title, body]) => `<div class="panel"><h3>${escapeHtml(title)}</h3><div class="muted">${escapeHtml(body)}</div></div>`).join("");
      docMeta.innerHTML = "<b>新窗口接手输出</b>";
      docBody.textContent = JSON.stringify(data, null, 2);
    }

    async function resolveQuery(query) {
      const data = await api(`/api/resolve?q=${encodeURIComponent(query)}`);
      const rows = [
        { 项: "用户说法", 值: data.query },
        { 项: "标准编号", 值: data.standard },
        { 项: "页面命中", 值: data.page ? `${data.page["页面名"]} / ${data.page["入口/路径"]}` : "无" },
        { 项: "技能命中", 值: data.skill ? `${data.skill["技能名"]} / ${data.skill["建议文档"]}` : "无" },
      ];
      document.querySelector("#index-result").innerHTML = table(rows);
      docMeta.innerHTML = "<b>索引解析结果</b>";
      docBody.textContent = JSON.stringify(data, null, 2);
    }

    async function loadResources(kind = "pageBadges") {
      if (!state.resources) state.resources = await api("/api/resources");
      const names = {
        pageBadges: "页面编号",
        ports: "端口",
        machines: "电脑环境",
        secretRefs: "Secret 引用",
        serverCandidates: "服务器候选",
      };
      document.querySelector("#resource-view").innerHTML = `<h3>${names[kind]}</h3>${table(state.resources[kind])}`;
      docMeta.innerHTML = `<b>${names[kind]} JSON</b>`;
      docBody.textContent = JSON.stringify(state.resources[kind], null, 2);
    }

    async function loadProposals() {
      const data = await api("/api/proposals");
      document.querySelector("#proposal-list").innerHTML = table(data.proposals);
      docMeta.innerHTML = "<b>待审核提案列表</b>";
      docBody.textContent = JSON.stringify(data, null, 2);
    }

    async function createProposal() {
      const data = await api("/api/proposal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: document.querySelector("#proposal-title").value,
          detail: document.querySelector("#proposal-detail").value,
          kind: document.querySelector("#proposal-kind").value,
          official: document.querySelector("#proposal-official").checked,
        }),
      });
      docMeta.innerHTML = `<b>已生成提案</b><br>${escapeHtml(data.path)}`;
      docBody.textContent = data.content;
      await loadProposals();
    }

    async function loadSecretPolicy() {
      const data = await api("/api/secret-policy");
      document.querySelector("#secret-policy").innerHTML = `
        <div class="grid-2">
          <div class="panel"><h3>规则文件</h3><div>${escapeHtml(data.ruleFile)}</div></div>
          <div class="panel"><h3>受限凭据文件</h3><div>${escapeHtml(data.restrictedFile)}</div></div>
        </div>
        <h3>允许记录真实凭据的条件</h3>
        ${table(data.allowedWhen.map((item, index) => ({ 序号: index + 1, 条件: item })))}
        <div class="checkline">${escapeHtml(data.demoExport)}</div>
      `;
      docMeta.innerHTML = "<b>凭据规则</b>";
      docBody.textContent = JSON.stringify(data, null, 2);
    }

    async function runCheck() {
      const data = await api("/api/check");
      document.querySelector("#check-output").textContent = data.check.output;
      docMeta.innerHTML = `<b>系统自检</b><br>退出码：${data.check.code}`;
      docBody.textContent = JSON.stringify(data, null, 2);
    }

    function switchView(name) {
      document.querySelectorAll("[id^='view-']").forEach((el) => el.classList.add("hidden"));
      document.querySelector(`#view-${name}`).classList.remove("hidden");
      document.querySelectorAll(".nav-button").forEach((button) => button.classList.toggle("active", button.dataset.view === name));
      if (name === "handoff") loadStartPack();
      if (name === "resources") loadResources();
      if (name === "proposals") loadProposals();
      if (name === "secrets") loadSecretPolicy();
      if (name === "check") runCheck();
    }

    document.addEventListener("click", async (event) => {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.view) switchView(target.dataset.view);
      if (target.dataset.openDoc) await openDoc(target.dataset.openDoc);
      if (target.dataset.query) {
        document.querySelector("#query").value = target.dataset.query;
        await resolveQuery(target.dataset.query);
      }
      if (target.dataset.resource) await loadResources(target.dataset.resource);
    });

    document.querySelector("#load-startpack").addEventListener("click", loadStartPack);
    document.querySelector("#resolve").addEventListener("click", () => resolveQuery(document.querySelector("#query").value || "页面22"));
    document.querySelector("#create-proposal").addEventListener("click", createProposal);
    document.querySelector("#load-proposals").addEventListener("click", loadProposals);
    document.querySelector("#run-check").addEventListener("click", runCheck);

    async function boot() {
      const [status, structure] = await Promise.all([api("/api/status"), api("/api/structure")]);
      state.structure = structure;
      renderStatus(status);
      renderStructure(structure);
      await openDoc("README.md");
    }

    boot().catch((error) => {
      statusEl.innerHTML = `<span class="pill warn">面板启动失败</span>`;
      docBody.textContent = String(error);
    });
  </script>
</body>
</html>
