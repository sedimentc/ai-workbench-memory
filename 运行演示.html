<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台记忆面板</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #fff;
      --line: #d9dee7;
      --ink: #151922;
      --muted: #667085;
      --green: #17694f;
      --green-soft: #e8f5ef;
      --blue-soft: #edf4ff;
      --yellow-soft: #fff7df;
      --red: #d92d20;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      cursor: pointer;
      min-height: 34px;
      padding: 7px 12px;
    }
    button:hover { border-color: var(--green); background: var(--green-soft); }
    button.primary { background: var(--green); color: #fff; border-color: var(--green); font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 78px; resize: vertical; }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .titlebar {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(620px, 1.4fr);
      gap: 12px;
      padding: 10px 14px 8px;
      align-items: center;
    }
    .brand {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .badge-red {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }
    h1 { margin: 0; font-size: 18px; line-height: 1.2; }
    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 120px 160px minmax(220px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
    }
    .checks {
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
      color: var(--muted);
      font-size: 13px;
    }
    .checks input { width: auto; }
    .wide-action {
      padding: 0 14px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .52fr);
      gap: 12px;
    }
    .greenbar {
      background: var(--green);
      color: #fff;
      border-radius: 6px;
      border: 0;
      min-height: 36px;
      font-weight: 800;
      width: 100%;
    }
    .notice {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      padding: 9px 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rows {
      padding: 12px 14px 0;
      display: grid;
      gap: 10px;
    }
    .module-map {
      display: grid;
      gap: 8px;
    }
    .module-tile {
      width: 100%;
      min-height: 70px;
      text-align: left;
      padding: 9px 10px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .module-tile.active {
      border-color: var(--green);
      background: var(--green-soft);
    }
    .module-code {
      display: inline-grid;
      place-items: center;
      min-width: 32px;
      height: 24px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 850;
      margin-bottom: 6px;
    }
    .module-name {
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .module-role {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .control-row {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(560px, 1.5fr) minmax(260px, .72fr);
      gap: 10px;
      align-items: center;
    }
    .row-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 10px 12px;
      min-height: 58px;
    }
    .row-title { font-weight: 800; margin-bottom: 2px; }
    .row-sub { color: var(--muted); font-size: 12px; }
    .inline-controls {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
    }
    .search-controls { grid-template-columns: minmax(260px, 1fr) 90px; }
    .small-controls {
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--blue-soft);
      padding: 5px 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .main {
      padding: 12px 14px 18px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .summary .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 11px 12px;
      min-height: 76px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .card-value { font-size: 18px; font-weight: 850; margin-top: 6px; }
    .tag {
      display: inline-block;
      border-radius: 999px;
      background: var(--yellow-soft);
      color: #8a5a00;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap;
    }
    .tag.ok { background: #dcfce7; color: #166534; }
    .tag.blue { background: var(--blue-soft); color: #1d4ed8; }
    .workbench {
      --sidebar-width: 248px;
      --content-width: 540px;
      display: grid;
      grid-template-columns: var(--sidebar-width) 8px var(--content-width) 8px minmax(320px, 1fr);
      gap: 0;
    }
    .module-sidebar {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 10px;
      align-self: start;
      position: sticky;
      top: 150px;
      max-height: calc(100vh - 170px);
      overflow: auto;
    }
    .resizer {
      align-self: stretch;
      cursor: col-resize;
      position: relative;
      min-height: 360px;
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 2px;
      background: var(--line);
      border-radius: 999px;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--green);
      width: 3px;
      left: 2px;
    }
    .sidebar-title {
      font-weight: 850;
      margin: 2px 2px 10px;
    }
    .entry-stack {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .workspace-panel { min-width: 0; }
    .col {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-height: calc(100vh - 270px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .col-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: start;
    }
    .col-title { font-weight: 850; }
    .col-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .col-body {
      padding: 10px;
      overflow: auto;
      min-height: 360px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      margin-bottom: 8px;
      background: #fff;
    }
    .item.clickable {
      cursor: pointer;
    }
    .item.clickable:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }
    .item.compact {
      min-height: 38px;
      display: grid;
      grid-template-columns: minmax(120px, .62fr) minmax(70px, .22fr) minmax(120px, 1fr);
      gap: 10px;
      align-items: center;
      padding: 7px 9px;
      margin-bottom: 6px;
    }
    .item.soft { background: #fbfcfe; }
    .item-title {
      font-weight: 750;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .item-meta { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
    .item-body { margin-top: 8px; white-space: pre-wrap; font-size: 13px; }
    .item.compact .item-title,
    .item.compact .item-meta,
    .item.compact .item-body {
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .item.compact .item-title {
      display: block;
    }
    .split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .query-row { display: grid; grid-template-columns: 1fr 72px; gap: 7px; margin-bottom: 8px; }
    .section-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      padding: 6px 2px 8px;
    }
    .doc-panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: calc(100vh - 270px);
      overflow: hidden;
    }
    .doc-meta {
      border-bottom: 1px solid var(--line);
      padding: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .doc-body {
      padding: 12px;
      max-height: none;
      overflow: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      background: #fbfcfe;
    }
    .empty { color: var(--muted); text-align: center; padding: 28px 10px; }
    @media (max-width: 1200px) {
      .titlebar, .wide-action, .control-row, .doc-panel { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      .module-sidebar { position: static; max-height: none; }
      .col { max-height: none; }
      .doc-panel { min-height: 360px; }
    }
    @media (max-width: 760px) {
      .workbench { grid-template-columns: 1fr; }
      .resizer { display: none; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="titlebar">
      <div class="brand">
        <div class="badge-red">17</div>
        <div>
          <h1>工作台记忆面板</h1>
          <div class="meta" id="top-meta">读取中</div>
        </div>
      </div>
      <div class="toolbar">
        <select id="project-select"><option>AI工作台</option></select>
        <select id="module-select"><option>全部模块</option></select>
        <select id="branch-select"><option>main</option></select>
        <div class="checks">
          <label><input id="toggle-b" type="checkbox" checked> 索引</label>
          <label><input id="toggle-c" type="checkbox" checked> Git</label>
          <label><input id="toggle-a" type="checkbox"> 受限</label>
        </div>
        <button id="refresh-all" class="primary">读取数据</button>
      </div>
    </div>
    <div class="wide-action">
      <button id="run-handoff" class="greenbar">生成新窗口接手包</button>
      <div class="notice" id="top-notice">等待读取</div>
    </div>
  </div>

  <div class="rows">
    <div class="control-row">
      <div class="row-card">
        <div class="row-title">07_实战索引查询</div>
        <div class="row-sub">输入页面编号、技能编号、窗口别名、字段名</div>
      </div>
      <div class="row-card inline-controls search-controls">
        <input id="query" value="" placeholder="例如：页面22 / SKILL-001 / 第四级聊天窗口">
        <button id="resolve-query" class="primary">查询</button>
      </div>
      <div class="row-card" id="query-hint">查询结果会显示在 `07_实战索引` 模块列，不再提供固定快捷键。</div>
    </div>
  </div>

  <main class="main">
    <section class="summary" id="summary"></section>

    <section class="workbench" id="workbench">
      <aside class="module-sidebar">
        <div class="sidebar-title">系统入口</div>
        <div class="entry-stack">
          <div class="item compact clickable" data-doc="AI入口.md" role="button" tabindex="0">
            <div class="item-title"><span>AI入口</span></div>
            <div class="item-meta">新窗口必读</div>
            <div class="item-body">AI入口.md</div>
          </div>
          <div class="item compact clickable" data-doc="总览.md" role="button" tabindex="0">
            <div class="item-title"><span>总览</span></div>
            <div class="item-meta">全局地图</div>
            <div class="item-body">总览.md</div>
          </div>
          <div class="item compact clickable" data-doc="00_规则/AI读取规则.md" role="button" tabindex="0">
            <div class="item-title"><span>AI读取规则</span></div>
            <div class="item-meta">读取优先级</div>
            <div class="item-body">00_规则/AI读取规则.md</div>
          </div>
        </div>
        <div class="sidebar-title">模块入口</div>
        <div class="module-map" id="module-map"></div>
      </aside>
      <div class="resizer" data-resizer="left" title="拖动调整快捷入口宽度"></div>
      <section class="workspace-panel" id="module-columns"></section>
      <div class="resizer" data-resizer="right" title="拖动调整工作区宽度"></div>
      <section class="doc-panel">
        <div class="doc-meta" id="doc-meta">未选择文档</div>
        <div class="doc-body" id="doc-body"></div>
      </section>
    </section>
  </main>

  <script>
    const state = { status: null, structure: null, git: null, resources: null, imported: null, proposals: null, candidates: null, startPack: null, index: null, activeModule: "01_项目" };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch]));
    const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));
    async function api(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    function item(title, meta, body = "", path = "", options = {}) {
      const compact = options.compact || Boolean(path);
      const classes = ["item", compact ? "compact" : "", path ? "clickable" : "", options.soft ? "soft" : ""].filter(Boolean).join(" ");
      const attrs = path ? ` data-doc="${escapeHtml(path)}" role="button" tabindex="0"` : "";
      return `<div class="${classes}"${attrs}><div class="item-title"><span>${escapeHtml(title)}</span></div><div class="item-meta">${escapeHtml(meta)}</div>${body ? `<div class="item-body">${escapeHtml(body)}</div>` : ""}</div>`;
    }
    function setPaneWidth(name, value) {
      const workbench = $("#workbench");
      if (!workbench) return;
      workbench.style.setProperty(name, `${Math.round(value)}px`);
      localStorage.setItem(`memory-panel-${name}`, String(Math.round(value)));
    }
    function restorePaneWidths() {
      const workbench = $("#workbench");
      if (!workbench) return;
      ["--sidebar-width", "--content-width"].forEach((name) => {
        const saved = Number(localStorage.getItem(`memory-panel-${name}`));
        if (saved > 0) workbench.style.setProperty(name, `${saved}px`);
      });
    }
    function paneWidth(name, fallback) {
      const raw = getComputedStyle($("#workbench")).getPropertyValue(name);
      return Number.parseFloat(raw) || fallback;
    }
    function initResizers() {
      restorePaneWidths();
      document.querySelectorAll(".resizer").forEach((resizer) => {
        resizer.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          resizer.classList.add("dragging");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          const type = resizer.dataset.resizer;
          const move = (moveEvent) => {
            const workbench = $("#workbench");
            const rect = workbench.getBoundingClientRect();
            const sidebar = paneWidth("--sidebar-width", 248);
            const content = paneWidth("--content-width", 540);
            if (type === "left") {
              setPaneWidth("--sidebar-width", clamp(moveEvent.clientX - rect.left, 170, rect.width - content - 380));
            } else {
              setPaneWidth("--content-width", clamp(moveEvent.clientX - rect.left - sidebar - 8, 280, rect.width - sidebar - 360));
            }
          };
          const up = () => {
            resizer.classList.remove("dragging");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up, { once: true });
        });
      });
    }
    const moduleView = {
      "00_规则": { count: "rules-count", title: "00_规则", sub: "AI读取 / 敏感信息 / Git协作 / 审核 / 阶段边界" },
      "01_项目": { count: "handoff-count", title: "01_项目", sub: "AI工作台 / StartPack / 当前状态 / 页面编号" },
      "03_工作流": { count: "workflow-count", title: "03_工作流", sub: "接手 / 会议沉淀 / 测试Agent / 资源申请" },
      "04_资源登记": { count: "resource-count", title: "04_资源登记", sub: "页面角标 / 端口 / 电脑环境 / secret / 服务器" },
      "05_待审核": { count: "proposal-count", title: "05_待审核", sub: "记忆提案 / Skill提案 / 资源变更提案" },
      "07_实战索引": { count: "index-count", title: "07_实战索引", sub: "别名 / 页面 / 技能 / 窗口 / 字段 / 连接信息" },
      "08_导入资料": { count: "import-count", title: "08_导入资料", sub: "本机项目资料 / 受限资料" },
      "scripts": { count: "branch-count", title: "scripts", sub: "自检 / 提案生成 / 演示包导出 / 本地面板服务" },
    };
    const fileTitle = (path) => path.split("/").pop().replace(/\.(md|py)$/i, "");
    function fileItems(files) {
      return files.map((path) => item(fileTitle(path), "文件", path, path)).join("");
    }
    function moduleBody(mod) {
      const intro = item(mod.role, mod.defaultRead, mod.purpose);
      const files = `<div class="section-label">模块文件</div>${fileItems(mod.files || [])}`;
      if (mod.module === "01_项目") {
        return `${intro}<div class="section-label">新窗口接手包</div><div id="handoff-col"></div>${files}`;
      }
      if (mod.module === "03_工作流") {
        const flow = (state.structure?.workflow || []).map((step, index) => `${index + 1}. ${step}`).join("\n");
        return `${intro}${item("执行链路", "从需求到沉淀", flow)}${files}`;
      }
      if (mod.module === "04_资源登记") {
        return `${intro}<div id="resource-col"></div>${files}`;
      }
      if (mod.module === "05_待审核") {
        return `${intro}<div id="proposal-col"></div>${files}`;
      }
      if (mod.module === "07_实战索引") {
        return `${intro}<div id="index-col"></div>${files}`;
      }
      if (mod.module === "08_导入资料") {
        return `${intro}
          <div class="item soft">
            <div class="item-title"><span>本机 MD 导入</span><button id="refresh-candidates">刷新候选</button></div>
            <div class="query-row"><select id="candidate-select"></select><button id="import-selected" class="primary">导入</button></div>
            <label class="chip"><input id="restricted-import" type="checkbox"> 作为受限资料导入</label>
            <div class="item-meta"><button id="open-import-index">打开导入目录说明</button></div>
          </div>
          <div id="import-col"></div>${files}`;
      }
      if (mod.module === "scripts") {
        return `${intro}
          <div class="item soft">
            <div class="item-title"><span>Git 与自检</span><button id="refresh-git" class="primary">刷新 Git</button></div>
            <div class="split2"><button id="run-check">系统自检</button><button id="open-readme">README</button></div>
            <div class="item-meta" id="git-line">读取中</div>
          </div>
          <div id="git-col"></div>${files}`;
      }
      return `${intro}${files}`;
    }
    function renderNumberedColumns() {
      const modules = state.structure?.modules || [];
      if (!modules.some((mod) => mod.module === state.activeModule)) {
        state.activeModule = modules.find((mod) => mod.module === "01_项目")?.module || modules[0]?.module || "";
      }
      $("#module-map").innerHTML = modules.map((mod) => {
        const code = mod.module === "scripts" ? "py" : mod.module.slice(0, 2);
        const active = mod.module === state.activeModule ? " active" : "";
        return `<button class="module-tile${active}" data-module="${escapeHtml(mod.module)}">
          <span class="module-code">${escapeHtml(code)}</span>
          <div class="module-name">${escapeHtml(mod.module)}</div>
          <div class="module-role">${escapeHtml(mod.role)}</div>
        </button>`;
      }).join("");
      const mod = modules.find((row) => row.module === state.activeModule);
      if (!mod) {
        $("#module-columns").innerHTML = "<div class='empty'>暂无模块</div>";
        return;
      }
      const view = moduleView[mod.module] || { count: "", title: mod.module, sub: mod.role };
      $("#module-columns").innerHTML = `<div class="col" data-column="${escapeHtml(mod.module)}">
          <div class="col-head">
            <div><div class="col-title">${escapeHtml(view.title)}</div><div class="col-sub">${escapeHtml(view.sub)}</div></div>
            <span class="tag ok" id="${escapeHtml(view.count)}">${(mod.files || []).length}</span>
          </div>
          <div class="col-body">${moduleBody(mod)}</div>
        </div>`;
    }
    function renderActiveModuleData() {
      renderHandoff();
      renderIndex();
      renderImported();
      renderGit();
      renderResources();
      renderProposals();
      renderCandidates();
    }
    function renderSummary() {
      const check = state.status?.check?.code === 0 ? "CHECK_PASS" : "CHECK_FAIL";
      const gitDirty = state.git?.status?.length || 0;
      const imported = state.imported?.imported?.length || 0;
      const proposals = state.proposals?.proposals?.length || 0;
      const branches = state.git?.branches?.length || 0;
      const pages = state.resources?.pageBadges?.filter((row) => row["编号"]).length || 0;
      $("#summary").innerHTML = [
        ["系统状态", check, "自检"],
        ["Git分支", `${branches} 个`, gitDirty ? `${gitDirty} 个改动` : "干净"],
        ["导入资料", `${imported} 份`, "08_导入资料"],
        ["待审核", `${proposals} 条`, "05_待审核"],
        ["页面编号", `${pages} 个`, "资源登记"],
        ["当前分支", state.git?.current || "-", "Git"],
      ].map(([name, value, sub]) => `<div class="card"><div class="card-head"><span>${name}</span><span class="tag">${sub}</span></div><div class="card-value">${value}</div></div>`).join("");
      $("#top-meta").textContent = `${state.status?.repo || ""} · ${state.git?.current || "-"} · ${state.status?.gitLatest || ""}`;
      $("#top-notice").textContent = `候选 ${state.candidates?.candidates?.length || 0} · 导入 ${imported} · 待审核 ${proposals} · 工作区 ${gitDirty ? "有改动" : "干净"}`;
      if ($("#git-line")) $("#git-line").textContent = state.git?.remote || "未配置远端";
    }
    function renderHandoff() {
      const data = state.startPack;
      const count = $("#handoff-count");
      const col = $("#handoff-col");
      if (!col) return;
      if (!data) {
        if (count) count.textContent = "0";
        col.innerHTML = "<div class='empty'>点击上方“生成新窗口接手包”后显示。</div>";
        return;
      }
      if (count) count.textContent = data.filesRead.length;
      col.innerHTML = [
        item("读取文件", "接手顺序", data.filesRead.join("\n")),
        item("当前目标", "StartPack", data.goal),
        item("当前状态", "StartPack", data.state),
        item("确认规则", "StartPack", data.confirmedRules),
      ].join("");
    }
    function renderIndex() {
      const data = state.index;
      const count = $("#index-count");
      const col = $("#index-col");
      if (!col) return;
      if (count) count.textContent = data?.query ? 1 : 0;
      if (!data?.query) {
        col.innerHTML = "<div class='empty'>输入页面编号、技能编号、窗口别名或字段名后查询。</div>";
        return;
      }
      col.innerHTML = [
        item("用户说法", data.query, `标准编号：${data.standard}`),
        data.alias ? item("别名命中", data.alias["标准对象"], data.alias["下一步"]) : item("别名命中", "无"),
        data.page ? item("页面命中", data.page["页面名"], `${data.page["页面编号"]}\n${data.page["入口/路径"]}\n${data.page["文档定位"]}`) : "",
        data.skill ? item("技能命中", data.skill["技能名"], `${data.skill["技能ID"]}\n${data.skill["建议文档"]}`) : "",
      ].join("");
    }
    function renderImported() {
      const imported = state.imported?.imported || [];
      const count = $("#import-count");
      const col = $("#import-col");
      if (!col) return;
      if (count) count.textContent = imported.length;
      col.innerHTML = imported.length ? imported.map((row) => item(row.title, `${row.sensitivity} · ${row.status}`, row.path, row.path)).join("") : "<div class='empty'>暂无导入资料</div>";
    }
    function renderGit() {
      const git = state.git;
      const count = $("#branch-count");
      const col = $("#git-col");
      if (!git || !col) return;
      if (count) count.textContent = git.branches.length;
      const mainBranch = git.branches.find((row) => row.name === "main") || git.branches.find((row) => row.name.endsWith("/main"));
      const currentBranch = git.branches.find((row) => row.active) || git.branches.find((row) => row.name === git.current);
      const compact = { compact: true };
      const mainline = mainBranch ? item("主线 main", mainBranch.commit.slice(0, 12), mainBranch.message, "", compact) : item("主线 main", "未找到", "", "", compact);
      const branchLine = currentBranch ? item(`当前支线 ${git.current}`, currentBranch.commit.slice(0, 12), currentBranch.message, "", compact) : item(`当前支线 ${git.current}`, "当前分支", "", "", compact);
      const status = git.status.length ? git.status.map((line) => item(line, "working tree", "", "", compact)).join("") : item("工作区干净", "status", "", "", compact);
      const branches = git.branches.map((row) => item(row.active ? `* ${row.name}` : row.name, row.commit.slice(0, 12), row.message, "", compact)).join("");
      const commits = git.commits.map((row) => item(row.commit, "commit", row.message, "", compact)).join("");
      col.innerHTML = `<div class="item soft"><div class="item-title"><span>Git 主线 / 支线</span><span class="tag ok">${escapeHtml(git.current)}</span></div><div class="item-meta">${escapeHtml(git.remote || "无远端")}</div></div>${mainline}${branchLine}${status}${branches}${commits}`;
      $("#branch-select").innerHTML = git.branches.map((row) => `<option ${row.active ? "selected" : ""}>${escapeHtml(row.name)}</option>`).join("");
    }
    function renderResources() {
      const res = state.resources;
      const count = $("#resource-count");
      const col = $("#resource-col");
      if (!res || !col) return;
      const pages = res.pageBadges.filter((row) => row["编号"]).slice(-12).reverse();
      if (count) count.textContent = res.pageBadges.filter((row) => row["编号"]).length;
      col.innerHTML = [
        item("页面编号池", "AI工作台", `${pages.length} 条显示`),
        ...pages.map((row) => item(`#${row["编号"]} ${row["页面/模块"]}`, row["项目"], row["路径或说明"])),
        item("端口", `${res.ports.length} 条`, res.ports.slice(0, 4).map((row) => Object.values(row).join(" · ")).join("\n")),
        item("电脑环境", `${res.machines.length} 台`, res.machines.map((row) => Object.values(row).join(" · ")).join("\n")),
      ].join("");
    }
    function renderProposals() {
      const rows = state.proposals?.proposals || [];
      const count = $("#proposal-count");
      const col = $("#proposal-col");
      if (!col) return;
      if (count) count.textContent = rows.length;
      col.innerHTML = `
        <div class="item soft">
          <input id="proposal-title" value="页面22接手规则补充">
          <textarea id="proposal-detail">用户说页面22时，AI 应先查别名词典和页面索引，再读项目 StartPack。</textarea>
          <div class="split2"><button id="create-demo-proposal">生成演示提案</button><button id="create-real-proposal" class="primary">写入待审核</button></div>
        </div>
        ${rows.map((row) => item(row.title, `${row.category} · ${row.status}`, `${row.id}\n${row.path}`, row.path.startsWith("05_") ? row.path : "")).join("")}
      `;
    }
    function renderCandidates() {
      const candidates = state.candidates?.candidates || [];
      const select = $("#candidate-select");
      if (!select) return;
      select.innerHTML = candidates.slice(0, 80).map((row) => `<option value="${escapeHtml(row.path)}" data-restricted="${row.restrictedHint ? "1" : "0"}">${escapeHtml(row.name)} · ${Math.round(row.size / 1024)}KB</option>`).join("");
    }
    async function openDoc(path) {
      const data = await api(`/api/document?path=${encodeURIComponent(path)}`);
      const meta = data.frontmatter || {};
      $("#doc-meta").innerHTML = `<b>${escapeHtml(data.path)}</b><br>${escapeHtml(meta.type || "-")} · ${escapeHtml(meta.status || "-")} · ${escapeHtml(meta.sensitivity || "-")}${data.restricted ? " · 受限脱敏" : ""}`;
      $("#doc-body").textContent = data.body;
    }
    async function loadAll() {
      const [status, structure, git, resources, imported, proposals, candidates] = await Promise.all([
        api("/api/status"),
        api("/api/structure"),
        api("/api/git"),
        api("/api/resources"),
        api("/api/imported"),
        api("/api/proposals"),
        api("/api/import-candidates"),
      ]);
      Object.assign(state, { status, structure, git, resources, imported, proposals, candidates, startPack: null });
      renderNumberedColumns(); renderSummary(); renderActiveModuleData();
      if (!$("#doc-body").textContent) openDoc("AI入口.md");
    }
    async function generateHandoff() {
      state.startPack = await api("/api/start-pack");
      state.activeModule = "01_项目";
      renderNumberedColumns(); renderActiveModuleData();
      $("#top-notice").textContent = `接手包已生成 · 读取 ${state.startPack.filesRead.length} 个核心文件 · 显示在右侧工作区`;
    }
    async function resolveQuery(value) {
      state.index = await api(`/api/resolve?q=${encodeURIComponent(value)}`);
      state.activeModule = "07_实战索引";
      renderNumberedColumns(); renderActiveModuleData();
      $("#doc-meta").innerHTML = "<b>索引结果</b>";
      $("#doc-body").textContent = JSON.stringify(state.index, null, 2);
    }
    async function importSelected() {
      const select = $("#candidate-select");
      const path = select.value;
      const title = select.selectedOptions[0]?.textContent?.split(" · ")[0] || "导入资料";
      const restricted = $("#restricted-import").checked || select.selectedOptions[0]?.dataset.restricted === "1";
      const result = await api("/api/import-material", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, title, restricted }),
      });
      state.imported = await api("/api/imported");
      state.activeModule = "08_导入资料";
      renderNumberedColumns(); renderActiveModuleData(); renderSummary();
      openDoc(result.path);
    }
    async function createProposal(official) {
      const result = await api("/api/proposal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: $("#proposal-title").value,
          detail: $("#proposal-detail").value,
          official,
          kind: "memory",
        }),
      });
      state.proposals = await api("/api/proposals");
      state.activeModule = "05_待审核";
      renderNumberedColumns(); renderActiveModuleData(); renderSummary();
      $("#doc-meta").innerHTML = `<b>${escapeHtml(result.path)}</b>`;
      $("#doc-body").textContent = result.content;
    }
    async function runCheck() {
      const data = await api("/api/check");
      $("#doc-meta").innerHTML = "<b>系统自检</b>";
      $("#doc-body").textContent = data.check.output;
      state.status = await api("/api/status");
      renderSummary();
    }
    document.addEventListener("click", async (event) => {
      const docTarget = event.target.closest("[data-doc]");
      if (docTarget) {
        openDoc(docTarget.dataset.doc);
        return;
      }
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.module) {
        state.activeModule = button.dataset.module;
        renderNumberedColumns(); renderActiveModuleData();
        return;
      }
      if (button.dataset.query) { $("#query").value = button.dataset.query; resolveQuery(button.dataset.query); }
      if (button.id === "refresh-all") loadAll();
      if (button.id === "run-handoff") generateHandoff();
      if (button.id === "resolve-query") resolveQuery($("#query").value);
      if (button.id === "refresh-candidates") { state.candidates = await api("/api/import-candidates"); renderCandidates(); }
      if (button.id === "import-selected") importSelected();
      if (button.id === "open-import-index") openDoc("08_导入资料/README.md");
      if (button.id === "refresh-git") { state.git = await api("/api/git"); renderGit(); renderSummary(); }
      if (button.id === "run-check") runCheck();
      if (button.id === "open-readme") openDoc("README.md");
      if (button.id === "create-demo-proposal") createProposal(false);
      if (button.id === "create-real-proposal") createProposal(true);
    });
    document.addEventListener("change", (event) => {
      if (event.target?.id !== "candidate-select") return;
      $("#restricted-import").checked = $("#candidate-select").selectedOptions[0]?.dataset.restricted === "1";
    });
    document.addEventListener("keydown", (event) => {
      if (!["Enter", " "].includes(event.key)) return;
      const docTarget = event.target.closest("[data-doc]");
      if (!docTarget) return;
      event.preventDefault();
      openDoc(docTarget.dataset.doc);
    });
    initResizers();
    loadAll().catch((error) => {
      $("#top-meta").textContent = "读取失败";
      $("#doc-body").textContent = String(error);
    });
  </script>
</body>
</html>
