<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台记忆面板</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #fff;
      --line: #d9dee7;
      --ink: #151922;
      --muted: #667085;
      --green: #17694f;
      --green-soft: #e8f5ef;
      --blue-soft: #edf4ff;
      --yellow-soft: #fff7df;
      --red: #d92d20;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; overflow-y: auto; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100%;
      overflow-y: auto;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      cursor: pointer;
      min-height: 34px;
      padding: 7px 12px;
    }
    button:hover { border-color: var(--green); background: var(--green-soft); }
    button.primary { background: var(--green); color: #fff; border-color: var(--green); font-weight: 700; }
    button.danger { color: var(--red); border-color: #fecdca; background: #fff; }
    button.danger:hover { background: #fef3f2; border-color: var(--red); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 78px; resize: vertical; }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .search-only {
      padding: 10px 14px;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 96px;
      gap: 8px;
    }
    .module-map {
      display: grid;
      gap: 8px;
    }
    .module-tile {
      width: 100%;
      min-height: 70px;
      text-align: left;
      padding: 9px 10px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .module-tile.active {
      border-color: var(--green);
      background: var(--green-soft);
    }
    .module-code {
      display: inline-grid;
      place-items: center;
      min-width: 32px;
      height: 24px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 850;
      margin-bottom: 6px;
    }
    .module-name {
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .module-role {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .small-controls {
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--blue-soft);
      padding: 5px 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .main {
      padding: 12px 14px 18px;
    }
    .entry-overview {
      margin-bottom: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 10px 12px 12px;
    }
    .entry-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 9px;
    }
    .entry-title {
      font-weight: 850;
      font-size: 16px;
    }
    .entry-sub {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 8px;
    }
    .module-overview {
      margin-bottom: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 10px 12px 12px;
    }
    .module-overview .module-map {
      grid-template-columns: repeat(8, minmax(120px, 1fr));
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .module-overview .module-tile {
      min-width: 120px;
      min-height: 64px;
    }
    .module-overview .module-code {
      margin-bottom: 5px;
    }
    .tag {
      display: inline-block;
      border-radius: 999px;
      background: var(--yellow-soft);
      color: #8a5a00;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap;
    }
    .tag.ok { background: #dcfce7; color: #166534; }
    .tag.blue { background: var(--blue-soft); color: #1d4ed8; }
    .workbench {
      --content-width: 540px;
      --workbench-height: 520px;
      display: grid;
      grid-template-columns: var(--content-width) 8px minmax(320px, 1fr);
      gap: 0;
      min-height: var(--workbench-height);
      align-items: start;
    }
    .resizer {
      align-self: stretch;
      cursor: col-resize;
      position: relative;
      min-height: var(--workbench-height);
    }
    .resizer::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 2px;
      background: var(--line);
      border-radius: 999px;
    }
    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--green);
      width: 3px;
      left: 2px;
    }
    .workspace-panel { min-width: 0; }
    .col {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-height: var(--workbench-height);
      overflow: visible;
      display: grid;
      grid-template-rows: auto auto;
    }
    .col-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: start;
    }
    .col-title { font-weight: 850; }
    .col-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .col-body {
      padding: 10px;
      overflow: visible;
      min-height: 0;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      margin-bottom: 8px;
      background: #fff;
    }
    .item.clickable {
      cursor: pointer;
    }
    .item.clickable:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }
    .item.compact {
      min-height: 38px;
      display: grid;
      grid-template-columns: minmax(120px, .62fr) minmax(70px, .22fr) minmax(120px, 1fr);
      gap: 10px;
      align-items: center;
      padding: 7px 9px;
      margin-bottom: 6px;
    }
    .item.soft { background: #fbfcfe; }
    .item-title {
      font-weight: 750;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .item-meta { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
    .item-body { margin-top: 8px; white-space: pre-wrap; font-size: 13px; }
    .item.compact .item-title,
    .item.compact .item-meta,
    .item.compact .item-body {
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .item.compact .item-title {
      display: block;
    }
    .split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .query-row { display: grid; grid-template-columns: 1fr 72px; gap: 7px; margin-bottom: 8px; }
    .section-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      padding: 6px 2px 8px;
    }
    .project-tree {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      padding: 8px;
    }
    .tree-group {
      position: relative;
      padding-left: 18px;
      margin-bottom: 10px;
    }
    .tree-group:last-child { margin-bottom: 0; }
    .tree-group::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 42px;
      bottom: 6px;
      width: 2px;
      background: var(--line);
    }
    .tree-children {
      position: relative;
      display: grid;
      gap: 6px;
    }
    .tree-group.collapsed::before {
      display: none;
    }
    .tree-group.collapsed .tree-children {
      display: none;
    }
    .tree-row {
      width: 100%;
      min-width: 0;
      min-height: 38px;
      display: grid;
      grid-template-columns: 38px minmax(130px, .28fr) minmax(130px, .24fr) minmax(180px, 1fr);
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 7px 9px;
      text-align: left;
      box-shadow: 0 1px 1px rgba(15, 23, 42, .03);
      cursor: pointer;
    }
    button.tree-row {
      color: var(--ink);
      font-weight: 400;
    }
    .tree-row:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }
    .tree-row.department {
      grid-template-columns: minmax(120px, .28fr) minmax(130px, .24fr);
      border-color: #cbd6e4;
      background: #fff;
      font-weight: 760;
    }
    .dept-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .dept-arrow {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 11px;
      transition: transform .15s ease;
    }
    .tree-group.collapsed .tree-row.department .dept-arrow {
      transform: rotate(-90deg);
    }
    .tree-row.project {
      width: calc(100% - 22px);
      margin-left: 22px;
    }
    .tree-row.leaf {
      width: calc(100% - 48px);
      margin-left: 48px;
      min-height: 34px;
      background: #fff;
    }
    .tree-row.pack {
      border-color: #c6e9d7;
      background: #f8fffb;
    }
    .tree-row.code {
      border-color: #cdddf9;
      background: #fbfdff;
    }
    .tree-code {
      display: inline-grid;
      place-items: center;
      min-width: 30px;
      height: 24px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 850;
      font-size: 12px;
      white-space: nowrap;
    }
    .tree-row.project .tree-code { background: var(--blue-soft); color: #1f4e8c; }
    .tree-row.leaf .tree-code { background: #f1f3f7; color: var(--muted); }
    .tree-title {
      min-width: 0;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tree-meta,
    .tree-path {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hierarchy-list {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }
    .hierarchy-shell {
      padding: 0;
      overflow: hidden;
    }
    .hierarchy-shell > summary {
      list-style: none;
      display: grid;
      grid-template-columns: minmax(140px, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      cursor: pointer;
      padding: 9px 10px;
      font-weight: 850;
    }
    .hierarchy-shell > summary::-webkit-details-marker { display: none; }
    .hierarchy-shell > summary .summary-arrow {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 22px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      transition: transform .15s ease;
    }
    .hierarchy-shell:not([open]) > summary .summary-arrow {
      transform: rotate(-90deg);
    }
    .hierarchy-content {
      border-top: 1px solid var(--line);
      padding: 9px 10px 10px;
    }
    .hierarchy-row {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) 92px;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 7px;
    }
    .hierarchy-label {
      min-width: 0;
    }
    .hierarchy-label strong {
      display: block;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hierarchy-label span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hierarchy-fields {
      display: grid;
      gap: 7px;
      min-width: 0;
    }
    .hierarchy-fields.three {
      grid-template-columns: repeat(3, minmax(76px, 1fr));
    }
    .hierarchy-fields.two {
      grid-template-columns: repeat(2, minmax(90px, 1fr));
    }
    .hierarchy-row input,
    .hierarchy-row select,
    .hierarchy-row button {
      min-height: 34px;
    }
    .hierarchy-row input[type="file"] {
      min-height: 34px;
      padding: 6px 8px;
    }
    .project-filter {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 78px;
      gap: 7px;
      align-items: center;
      margin: 2px 0 9px;
    }
    .project-filter input,
    .project-filter button {
      min-height: 34px;
    }
    .action-line {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }
    .doc-panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto auto;
      min-height: var(--workbench-height);
      overflow: visible;
    }
    .doc-meta {
      border-bottom: 1px solid var(--line);
      padding: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .doc-body {
      padding: 12px;
      max-height: none;
      overflow: visible;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      background: #fbfcfe;
    }
    .doc-body.github-body {
      padding: 0;
      white-space: normal;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #fff;
    }
    .github-meta-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 850;
    }
    .github-meta-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .github-view {
      display: grid;
      grid-template-columns: minmax(190px, 260px) minmax(0, 1fr);
      min-height: 100%;
      height: auto;
    }
    .github-sidebar {
      min-width: 0;
      border-right: 1px solid var(--line);
      background: #f6f8fa;
      padding: 10px 9px;
      overflow: visible;
    }
    .github-sidebar-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      font-weight: 850;
      margin-bottom: 9px;
    }
    .github-branch {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 7px 8px;
      margin-bottom: 8px;
      color: #344054;
      font-weight: 700;
    }
    .github-file-search {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      padding: 7px 8px;
      margin-bottom: 8px;
    }
    .github-file-list {
      display: grid;
      gap: 2px;
    }
    .github-file-row {
      width: 100%;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      min-height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      padding: 5px 6px;
      text-align: left;
      color: var(--ink);
    }
    .github-file-row:hover,
    .github-file-row.active {
      background: #eaf2ff;
    }
    .github-file-row span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .github-main {
      min-width: 0;
      overflow: visible;
      padding: 12px;
    }
    .github-breadcrumb {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 15px;
      font-weight: 850;
      margin-bottom: 10px;
    }
    .github-breadcrumb .repo {
      color: #0969da;
    }
    .github-commit {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .github-avatar {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 850;
    }
    .github-commit-message {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .github-commit-message b { color: var(--ink); margin-right: 6px; }
    .github-sha {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }
    .github-tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 7px 7px 0 0;
      background: #f6f8fa;
      padding: 7px 9px;
      color: var(--muted);
      font-weight: 700;
    }
    .github-tab {
      border-radius: 6px;
      padding: 5px 10px;
    }
    .github-tab.active {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .github-content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 280px);
      gap: 10px;
      align-items: start;
    }
    .github-code-box {
      border: 1px solid var(--line);
      border-radius: 0 0 7px 7px;
      background: #fff;
      overflow: auto;
    }
    .github-code-table {
      width: 100%;
      border-collapse: collapse;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .github-code-table td {
      padding: 0 10px;
      vertical-align: top;
      border: 0;
    }
    .github-line-no {
      width: 1%;
      min-width: 44px;
      color: #6e7781;
      background: #f6f8fa;
      text-align: right;
      user-select: none;
    }
    .github-line-code {
      white-space: pre;
      color: #24292f;
    }
    .github-side-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 10px;
      margin-bottom: 10px;
    }
    .github-side-card h4 {
      margin: 0 0 7px;
      font-size: 14px;
    }
    .github-history-row,
    .github-note-row {
      display: grid;
      gap: 3px;
      padding: 7px 0;
      border-top: 1px solid #edf0f5;
    }
    .github-history-row:first-of-type,
    .github-note-row:first-of-type {
      border-top: 0;
      padding-top: 0;
    }
    .github-history-row strong,
    .github-note-row strong {
      font-size: 12px;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .github-history-row span,
    .github-note-row span {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .github-dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .github-card-list {
      display: grid;
      gap: 6px;
    }
    .github-pill-row {
      display: grid;
      grid-template-columns: minmax(90px, .32fr) minmax(70px, .22fr) minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 8px;
      background: #fff;
    }
    .github-pill-row b,
    .github-pill-row span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .github-pill-row span {
      color: var(--muted);
      font-size: 12px;
    }
    .empty { color: var(--muted); text-align: center; padding: 28px 10px; }
    @media (max-width: 1200px) {
      .doc-panel { grid-template-columns: 1fr; }
      .entry-head { display: block; }
      .doc-panel { min-height: var(--workbench-height); }
      .github-view,
      .github-content-grid,
      .github-dashboard-grid {
        grid-template-columns: 1fr;
      }
      .github-sidebar {
        border-right: 0;

</head>
<body>

  <script>
    const state = { status: null, structure: null, projects: null, git: null, resources: null, imported: null, proposals: null, candidates: null, startPack: null, index: null, activeModule: "01_项目", projectSearch: "", collapsedDepartments: new Set(JSON.parse(localStorage.getItem("memory-collapsed-departments") || "[]")) };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch]));
    const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));
    async function api(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    function item(title, meta, body = "", path = "", options = {}) {
      const compact = options.compact || Boolean(path);
      const classes = ["item", compact ? "compact" : "", path ? "clickable" : "", options.soft ? "soft" : ""].filter(Boolean).join(" ");
      const attrs = path ? ` data-doc="${escapeHtml(path)}" role="button" tabindex="0"` : "";
      return `<div class="${classes}"${attrs}><div class="item-title"><span>${escapeHtml(title)}</span></div><div class="item-meta">${escapeHtml(meta)}</div>${body ? `<div class="item-body">${escapeHtml(body)}</div>` : ""}</div>`;
    }
    function setPaneWidth(name, value) {
      const workbench = $("#workbench");
      if (!workbench) return;
      workbench.style.setProperty(name, `${Math.round(value)}px`);
      localStorage.setItem(`memory-panel-${name}`, String(Math.round(value)));
    }
    function restorePaneWidths() {
      const workbench = $("#workbench");
      if (!workbench) return;
      ["--content-width"].forEach((name) => {
        const saved = Number(localStorage.getItem(`memory-panel-${name}`));
        if (saved > 0) workbench.style.setProperty(name, `${saved}px`);
      });
    }
    function paneWidth(name, fallback) {
      const raw = getComputedStyle($("#workbench")).getPropertyValue(name);
      return Number.parseFloat(raw) || fallback;
    }
    function fitWorkbenchHeight() {
      requestAnimationFrame(() => {
        const workbench = $("#workbench");
        if (!workbench) return;
        const top = workbench.getBoundingClientRect().top;
        const height = Math.max(260, Math.floor(window.innerHeight - top - 14));
        workbench.style.setProperty("--workbench-height", `${height}px`);
      });
    }
    function initResizers() {
      restorePaneWidths();
      document.querySelectorAll(".resizer").forEach((resizer) => {
        resizer.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          resizer.classList.add("dragging");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          const type = resizer.dataset.resizer;
          const move = (moveEvent) => {
            const workbench = $("#workbench");
            const rect = workbench.getBoundingClientRect();
            setPaneWidth("--content-width", clamp(moveEvent.clientX - rect.left, 280, rect.width - 360));
          };
          const up = () => {
            resizer.classList.remove("dragging");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up, { once: true });
        });
      });
    }
    const moduleView = {
      "00_规则": { count: "rules-count", title: "00_规则", sub: "AI读取 / 敏感信息 / Git协作 / 审核 / 阶段边界" },
      "01_项目": { count: "project-count", title: "01_项目", sub: "部门 / 项目 / StartPack / 当前状态 / 页面编号" },
      "03_工作流": { count: "workflow-count", title: "03_工作流", sub: "接手 / 会议沉淀 / 测试Agent / 资源申请" },
      "04_资源登记": { count: "resource-count", title: "04_资源登记", sub: "页面角标 / 端口 / 电脑环境 / secret / 服务器" },
      "05_待审核": { count: "proposal-count", title: "05_待审核", sub: "记忆提案 / Skill提案 / 资源变更提案" },
      "07_实战索引": { count: "index-count", title: "07_实战索引", sub: "别名 / 页面 / 技能 / 窗口 / 字段 / 连接信息" },
      "08_导入资料": { count: "import-count", title: "08_导入资料", sub: "本机项目资料 / 受限资料" },
      "scripts": { count: "branch-count", title: "scripts", sub: "自检 / 提案生成 / 演示包导出 / 本地面板服务" },
    };
    const fileTitle = (path) => path.split("/").pop().replace(/\.(md|py)$/i, "");
    function fileItems(files) {
      return files.map((path) => item(fileTitle(path), "文件", path, path)).join("");
    }
    function moduleBody(mod) {
      const intro = item(mod.role, mod.defaultRead, mod.purpose);
      const files = `<div class="section-label">模块文件</div>${fileItems(mod.files || [])}`;
      if (mod.module === "01_项目") {
        return `${intro}

              <div class="action-line" id="project-action-line">部门可删除；项目删除会移入 99_归档/旧项目记录。</div>

          <details class="item soft hierarchy-shell">

                </div>
                <div class="hierarchy-row">
                  <div class="hierarchy-label"><strong>选择文件夹</strong><span>生成项目记录</span></div>
                  <div class="hierarchy-fields two">
                    <input id="upload-repo" placeholder="Git 仓库地址，可空">
                    <input id="project-folder-input" type="file" webkitdirectory directory multiple>
                  </div>
                  <span class="tag blue">保存到上传文件</span>
                </div>
              </div>
              <div class="action-line" id="upload-action-line">选择整个项目文件夹后上传；会过滤 .git、node_modules、大文件，并生成上传清单。</div>
            </div>
          </details>
          <div class="section-label">部门项目导航</div>
          <div class="project-filter">
            <button id="show-all-projects">显示全部</button>
            <input id="project-search" placeholder="搜索部门、项目、负责人、Git仓库、MD文件">
            <button id="run-project-search" class="primary">搜索</button>
          </div>
          <div id="project-col"></div><div class="section-label">新窗口接手包</div><div id="handoff-col"></div>${files}`;
      }
      if (mod.module === "03_工作流") {
        const flow = (state.structure?.workflow || []).map((step, index) => `${index + 1}. ${step}`).join("\n");
        return `${intro}${item("执行链路", "从需求到沉淀", flow)}${files}`;
      }
      if (mod.module === "04_资源登记") {
        return `${intro}<div id="resource-col"></div>${files}`;
      }
      if (mod.module === "05_待审核") {
        return `${intro}<div id="proposal-col"></div>${files}`;
      }
      if (mod.module === "07_实战索引") {
        return `${intro}<div id="index-col"></div>${files}`;
      }
      if (mod.module === "08_导入资料") {
        return `${intro}
          <div class="item soft">
            <div class="item-title"><span>本机 MD 导入</span><button id="refresh-candidates">刷新候选</button></div>
            <div class="query-row"><select id="candidate-select"></select><button id="import-selected" class="primary">导入</button></div>
            <label class="chip"><input id="restricted-import" type="checkbox"> 作为受限资料导入</label>
            <div class="item-meta"><button id="open-import-index">打开导入目录说明</button></div>
          </div>
          <div id="import-col"></div>${files}`;
      }
      if (mod.module === "scripts") {
        return `${intro}
          <div class="item soft">
            <div class="item-title"><span>Git 与自检</span><button id="refresh-git" class="primary">刷新 Git</button></div>
            <div class="split2"><button id="run-check">系统自检</button><button id="open-readme">README</button></div>
            <div class="item-meta" id="git-line">读取中</div>
          </div>
          <div id="git-col"></div>${files}`;
      }
      return `${intro}${files}`;
    }
    function renderNumberedColumns() {
      const modules = state.structure?.modules || [];
      if (!modules.some((mod) => mod.module === state.activeModule)) {
        state.activeModule = modules.find((mod) => mod.module === "01_项目")?.module || modules[0]?.module || "";
      }
      $("#module-map").innerHTML = modules.map((mod) => {
        const code = mod.module === "scripts" ? "py" : mod.module.slice(0, 2);
        const active = mod.module === state.activeModule ? " active" : "";
        return `<button class="module-tile${active}" data-module="${escapeHtml(mod.module)}">
          <span class="module-code">${escapeHtml(code)}</span>
          <div class="module-name">${escapeHtml(mod.module)}</div>
          <div class="module-role">${escapeHtml(mod.role)}</div>
        </button>`;
      }).join("");
      const mod = modules.find((row) => row.module === state.activeModule);
      if (!mod) {
        $("#module-columns").innerHTML = "<div class='empty'>暂无模块</div>";
        return;
      }
      const view = moduleView[mod.module] || { count: "", title: mod.module, sub: mod.role };
      $("#module-columns").innerHTML = `<div class="col" data-column="${escapeHtml(mod.module)}">
          <div class="col-head">
            <div><div class="col-title">${escapeHtml(view.title)}</div><div class="col-sub">${escapeHtml(view.sub)}</div></div>
            <span class="tag ok" id="${escapeHtml(view.count)}">${(mod.files || []).length}</span>
          </div>
          <div class="col-body">${moduleBody(mod)}</div>
        </div>`;
      fitWorkbenchHeight();
    }
    function renderActiveModuleData() {
      renderProjects();
      renderHandoff();
      renderIndex();
      renderImported();
      renderGit();
      renderResources();
      renderProposals();
      renderCandidates();
    }
    function renderSummary() {
      const check = state.status?.check?.code === 0 ? "CHECK_PASS" : "CHECK_FAIL";
      const gitDirty = state.git?.status?.length || 0;
      const imported = state.imported?.imported?.length || 0;
      const proposals = state.proposals?.proposals?.length || 0;
      const branches = state.git?.branches?.length || 0;
      const pages = state.resources?.pageBadges?.filter((row) => row["编号"]).length || 0;
      if ($("#summary")) {
        $("#summary").innerHTML = [
          ["系统状态", check, "自检"],
          ["Git分支", `${branches} 个`, gitDirty ? `${gitDirty} 个改动` : "干净"],
          ["导入资料", `${imported} 份`, "08_导入资料"],
          ["待审核", `${proposals} 条`, "05_待审核"],
          ["页面编号", `${pages} 个`, "资源登记"],
          ["当前分支", state.git?.current || "-", "Git"],
        ].map(([name, value, sub]) => `<div class="card"><div class="card-head"><span>${name}</span><span class="tag">${sub}</span></div><div class="card-value">${value}</div></div>`).join("");
      }
      if ($("#top-meta")) $("#top-meta").textContent = `${state.status?.repo || ""} · ${state.git?.current || "-"} · ${state.status?.gitLatest || ""}`;
      if ($("#top-notice")) $("#top-notice").textContent = `候选 ${state.candidates?.candidates?.length || 0} · 导入 ${imported} · 待审核 ${proposals} · 工作区 ${gitDirty ? "有改动" : "干净"}`;
      if ($("#git-line")) $("#git-line").textContent = state.git?.remote || "未配置远端";
    }
    function allProjects() {
      return (state.projects?.departments || []).flatMap((dept) => (dept.projects || []).map((project) => ({ dept, project })));
    }
    function findProject(localPath) {
      return allProjects().find(({ project }) => project.localPath === localPath);
    }
    function projectSearchText(dept, project = null) {
      const projectText = project ? [
        project.name, project.status, project.repo, project.localPath, project.owner, project.note,
        ...(project.mdFiles || []).flatMap((file) => [file.title, file.path, file.modifier, file.updatedAt]),
      ] : [];
      return [dept.name, dept.owner, dept.status, dept.summary, dept.overview, ...projectText].join(" ").toLowerCase();
    }
    function visibleDepartments() {
      const source = state.projects?.departments || [];
      const keyword = (state.projectSearch || "").trim().toLowerCase();
      if (!keyword) return source;
      return source.map((dept) => {
        const deptMatched = projectSearchText(dept).includes(keyword);
        const projects = deptMatched ? (dept.projects || []) : (dept.projects || []).filter((project) => projectSearchText(dept, project).includes(keyword));
        return deptMatched || projects.length ? { ...dept, projects } : null;
      }).filter(Boolean);
    }
    function departmentKey(dept) {
      return dept.overview || dept.name || "";
    }
    function toggleDepartment(key) {
      if (!key) return;
      if (state.collapsedDepartments.has(key)) state.collapsedDepartments.delete(key);
      else state.collapsedDepartments.add(key);
      localStorage.setItem("memory-collapsed-departments", JSON.stringify([...state.collapsedDepartments]));
      renderProjects();
    }
    function renderProjects() {
      const col = $("#project-col");

      const searchInput = $("#project-search");
      if (searchInput) searchInput.value = state.projectSearch || "";

      }
      col.innerHTML = `<div class="project-tree">${departments.map((dept) => {

            <span class="tree-meta">${escapeHtml(dept.status)} · ${escapeHtml(dept.owner)}</span>
          </div>
          <div class="tree-children">

                <span class="tree-meta">更新 ${escapeHtml(project.updatedAt || "-")} · ${escapeHtml(project.modifier || "待确认")}</span>
                <span class="tree-path">${escapeHtml(project.status || "-")} · ${escapeHtml(project.owner || "未指定负责人")}</span>
              </button>
              <button class="tree-row leaf pack" data-project-pack="${escapeHtml(project.localPath)}">
                <span class="tree-code">获取</span>
                <span class="tree-title">新窗口接手包</span>
                <span class="tree-meta">一键获取最新 MD</span>
                <span class="tree-path">${escapeHtml(project.localPath)}</span>
              </button>
              <button class="tree-row leaf code" data-project-code="${escapeHtml(project.localPath)}">
                <span class="tree-code">代码</span>
                <span class="tree-title">项目代码</span>
                <span class="tree-meta">Git 分支 / 修改记录</span>
                <span class="tree-path">${escapeHtml(project.repo || project.localPath || "未登记仓库")}</span>
              </button>
              ${(project.mdFiles || []).map((file) => `
                <div class="tree-row leaf" data-doc="${escapeHtml(file.path)}" role="button" tabindex="0">
                  <span class="tree-code">MD</span>
                  <span class="tree-title">${escapeHtml(file.title || file.path)}</span>
                  <span class="tree-meta">${escapeHtml(file.updatedAt || "-")} · ${escapeHtml(file.modifier || "-")}</span>

              <div class="tree-row leaf">
                <span class="tree-code">空</span>
                <span class="tree-title">暂无项目</span>
                <span class="tree-meta">可在上方新增项目</span>
                <span class="tree-path">${escapeHtml(dept.overview || "")}</span>
              </div>
            `}
          </div>
        </div>
      `}).join("")}</div>`;
      renderProjectControls();
    }
    function renderProjectControls() {
      const departments = state.projects?.departments || [];
      const projectDepartment = $("#project-department");
      const uploadDepartment = $("#upload-department");
      const deleteDepartment = $("#delete-department-select");
      const deleteProject = $("#delete-project-select");
      if (!projectDepartment || !deleteDepartment || !deleteProject) return;
      const options = departments.map((dept) => `<option value="${escapeHtml(dept.overview)}">${escapeHtml(dept.name)}</option>`).join("");
      projectDepartment.innerHTML = options;
      if (uploadDepartment) uploadDepartment.innerHTML = options;

      state.status = await api("/api/status");
      state.git = await api("/api/git");
      state.activeModule = "01_项目";
      renderNumberedColumns(); renderActiveModuleData(); renderSummary();
      openDoc(result.path);
      if ($("#top-notice")) $("#top-notice").textContent = `项目文件夹已上传 · 保存 ${result.saved.length} 个文件 · 跳过 ${result.skipped.length} 个文件`;
      const nextLine = $("#upload-action-line");
      if (nextLine) nextLine.textContent = `上传完成：保存 ${result.saved.length} 个文件，跳过 ${result.skipped.length} 个文件。`;
    }
    async function deleteSelectedProjectLevel() {
      const projectValue = $("#delete-project-select").value;
      const departmentValue = $("#delete-department-select").value;
      if (projectValue.startsWith("project:")) {
        const [department, localPath] = projectValue.replace("project:", "").split("|");
        await mutateProjectHierarchy({ action: "delete_project", department, localPath }, "项目已从活跃列表移除，并归档到 99_归档/旧项目记录。");
        return;
      }
      if (departmentValue.startsWith("department:")) {
        await mutateProjectHierarchy({ action: "delete_department", overview: departmentValue.replace("department:", "") }, "空部门已删除，并同步更新部门总览。");
        return;
      }
      const line = $("#project-action-line");
      if (line) line.textContent = "请选择要归档的项目，或要删除的空部门。";
    }
    async function createProposal(official) {
      const result = await api("/api/proposal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: $("#proposal-title").value,
          detail: $("#proposal-detail").value,
          official,
          kind: "memory",
        }),
      });
      state.proposals = await api("/api/proposals");
      state.activeModule = "05_待审核";
      renderNumberedColumns(); renderActiveModuleData(); renderSummary();
      setPlainDocument(`<b>${escapeHtml(result.path)}</b>`, result.content);
    }
    async function runCheck() {
      const data = await api("/api/check");
      setPlainDocument("<b>系统自检</b>", data.check.output);
      state.status = await api("/api/status");
      renderSummary();
    }
    document.addEventListener("click", async (event) => {
      const deptToggle = event.target.closest("[data-dept-toggle]");
      if (deptToggle) {
        toggleDepartment(deptToggle.dataset.deptToggle);
        return;
      }
      const packTarget = event.target.closest("[data-project-pack]");
      if (packTarget) {
        loadProjectPack(packTarget.dataset.projectPack).catch((error) => { setPlainDocument("<b>读取失败</b>", String(error.message || error)); });
        return;
      }
      const codeTarget = event.target.closest("[data-project-code]");
      if (codeTarget) {
        loadProjectCode(codeTarget.dataset.projectCode).catch((error) => { setPlainDocument("<b>读取失败</b>", String(error.message || error)); });
        return;
      }
      const projectTarget = event.target.closest("[data-project-detail]");
      if (projectTarget) {
        showProjectDetail(projectTarget.dataset.projectDetail);
        return;
      }
      const docTarget = event.target.closest("[data-doc]");
      if (docTarget) {
        openDoc(docTarget.dataset.doc);
        return;
      }
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.module) {
        state.activeModule = button.dataset.module;
        renderNumberedColumns(); renderActiveModuleData();
        return;
      }
      if (button.dataset.query) { $("#query").value = button.dataset.query; resolveQuery(button.dataset.query); }
      if (button.id === "refresh-all") loadAll();
      if (button.id === "run-handoff") generateHandoff();
      if (button.id === "resolve-query") resolveQuery($("#query").value);
      if (button.id === "run-project-search") { state.projectSearch = $("#project-search").value; renderProjects(); }
      if (button.id === "show-all-projects") { state.projectSearch = ""; renderProjects(); }
      if (button.id === "refresh-candidates") { state.candidates = await api("/api/import-candidates"); renderCandidates(); }
      if (button.id === "import-selected") importSelected();
      if (button.id === "add-department") addDepartment().catch((error) => { const line = $("#project-action-line"); if (line) line.textContent = String(error.message || error); });
      if (button.id === "add-project") addProject().catch((error) => { const line = $("#project-action-line"); if (line) line.textContent = String(error.message || error); });
      if (button.id === "upload-project-folder") uploadProjectFolder().catch((error) => { const line = $("#upload-action-line"); if (line) line.textContent = String(error.message || error); });
      if (button.id === "delete-selected") deleteSelectedProjectLevel().catch((error) => { const line = $("#project-action-line"); if (line) line.textContent = String(error.message || error); });
      if (button.id === "open-import-index") openDoc("08_导入资料/README.md");
      if (button.id === "refresh-git") { state.git = await api("/api/git"); renderGit(); renderSummary(); }
      if (button.id === "run-check") runCheck();
      if (button.id === "open-readme") openDoc("README.md");
      if (button.id === "create-demo-proposal") createProposal(false);
      if (button.id === "create-real-proposal") createProposal(true);
    });
    document.addEventListener("change", (event) => {
      if (event.target?.id !== "candidate-select") return;
      $("#restricted-import").checked = $("#candidate-select").selectedOptions[0]?.dataset.restricted === "1";
    });
    document.addEventListener("keydown", (event) => {
      if (event.target?.id === "project-search" && event.key === "Enter") {
        event.preventDefault();
        state.projectSearch = $("#project-search").value;
        renderProjects();
        return;
      }
      if (!["Enter", " "].includes(event.key)) return;
      const deptToggle = event.target.closest("[data-dept-toggle]");
      if (deptToggle) {
        event.preventDefault();
        toggleDepartment(deptToggle.dataset.deptToggle);
        return;
      }
      const docTarget = event.target.closest("[data-doc]");
      if (!docTarget) return;
      event.preventDefault();
      openDoc(docTarget.dataset.doc);
    });
    initResizers();
    window.addEventListener("resize", fitWorkbenchHeight);
    loadAll().catch((error) => {
      if ($("#top-meta")) $("#top-meta").textContent = "读取失败";
      setPlainDocument("<b>读取失败</b>", String(error));
    });
  </script>
</body>
</html>
